<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADVISOR — دخول الأدمن</title><link rel="icon" href="/assets/brand/advisor_monogram.png"><link rel="stylesheet" href="/admin-assets/admin.css"><script src="/admin-assets/password.js" defer></script></head>
<body class="password-page"><main class="password-card">
  <div class="password-top"><a class="brand" href="/"><img src="/assets/brand/advisor_monogram.png" alt=""><span>ADVISOR</span></a><button id="passwordLanguage" type="button" class="button quiet">English</button></div>
  <p class="eyebrow" id="passwordEyebrow">دخول الأدمن</p><h1 id="passwordTitle">جارٍ التحقق…</h1><p class="muted" id="passwordDescription"></p>
  <!-- كلمة المرور تُرسل عبر HTTPS إلى الخادم ولا تُحفظ في تخزين المتصفح. -->
  <form id="passwordForm" hidden><label class="field"><span id="passwordLabel">كلمة المرور</span><input id="adminPassword" type="password" autocomplete="current-password" maxlength="128" required dir="auto"></label>
  <label class="field" id="confirmField" hidden><span id="confirmLabel">تأكيد كلمة المرور</span><input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128" dir="auto"></label>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem;">
    <button class="button primary" id="passwordSubmit" type="submit">دخول</button>
    <button class="button quiet" id="passwordForgot" type="button" hidden>نسيت كلمة المرور؟</button>
  </div></form>
  <form id="resetForm" hidden>
    <label class="field"><span id="resetCodeLabel">كود التحقق (من الإيميل)</span><input id="resetCode" type="text" autocomplete="one-time-code" maxlength="6" required dir="ltr" style="text-align:center;letter-spacing:5px;font-size:1.2rem;"></label>
    <label class="field"><span id="resetPasswordLabel">كلمة المرور الجديدة</span><input id="resetPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required dir="auto"></label>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem;">
      <button class="button primary" id="resetSubmit" type="submit">تغيير كلمة المرور</button>
      <button class="button quiet" id="resetCancel" type="button">إلغاء</button>
    </div>
  </form>
  <p class="inline-error" id="passwordError" role="alert" hidden></p><button id="passwordRetry" class="button quiet" type="button" hidden>إعادة المحاولة</button>
  <a class="muted" id="passwordBack" href="/">العودة للموقع</a>
</main></body></html>
